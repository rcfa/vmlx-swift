name: Build and Test

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    if: github.repository == 'osaurus-ai/vmlx-swift'
    # Advisory, not a gate. This fork's tree does not currently satisfy the pre-commit style rules
    # — the guard above named the UPSTREAM repository, so no job here had ever run and the drift
    # went unmeasured. It is 611 files, which is a formatting decision for the maintainer to take
    # deliberately, not something a build should be blocked on in the meantime.
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-rhel-ubi9
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true

      - name: Setup pre-commit
        shell: sh
        run: |
          uv pip install pre-commit

      - name: Get swift-format tag
        id: swift-format
        shell: sh
        run: |
          cd /tmp
          LATEST_TAG=$(curl -s https://api.github.com/repos/swiftlang/swift-format/releases/latest | \
            grep '"tag_name":' | \
            sed -E 's/.*"([^"]+)".*/\1/')
          echo "swift-format $LATEST_TAG"
          echo "SWIFT_FORMAT_VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Cache swift-format build
        uses: actions/cache@v4
        id: cache-swift-format
        with:
          path: /tmp/swift-format/.build
          key: ${{ runner.os }}-swift-format-build-${{ steps.swift-format.outputs.SWIFT_FORMAT_VERSION }}

      - name: Build swift-format
        if: steps.cache-swift-format.outputs.cache-hit != 'true'
        shell: sh
        run: |
          cd /tmp
          git clone --branch ${{ steps.swift-format.outputs.SWIFT_FORMAT_VERSION }} --depth 1 https://github.com/swiftlang/swift-format.git
          cd swift-format
          swift build -c release

      - name: Link swift-format to /usr/local/bin
        shell: sh
        run: |
          cd /tmp/swift-format
          ln -s "$(swift build --show-bin-path -c release)/swift-format" /usr/local/bin/swift-format

      - name: Configure safe directory for git
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run style checks
        shell: sh
        run: |
          pre-commit run --all || (echo "Style checks failed, please install pre-commit and run pre-commit run --all and push the change"; echo ""; git --no-pager diff; exit 1)

  mac_build_and_test:
    # Deliberately NOT `needs: lint`. Gating the build on style meant that the moment CI started
    # running, the only job that can actually tell us whether a pull request COMPILES was skipped
    # for every pull request. Correctness and formatting are independent questions; a red style
    # check should not hide a broken build.
    if: github.repository == 'osaurus-ai/vmlx-swift'
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify MetalToolchain installed
        shell: bash
        run: xcodebuild -showComponent MetalToolchain

      - name: Setup cmake
        shell: sh
        run: |
          brew install cmake ninja

      - name: Build SwiftPM (Xcode, macOS)
        shell: sh
        run: |
          xcodebuild -version
          xcrun --show-sdk-build-version
          swift --version
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          xcodebuild build-for-testing -scheme mlx-swift-Package -destination 'platform=macOS'

      - name: Run Tests SwiftPM (Xcode, macOS)
        shell: sh
        run: |
          xcrun xctest ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/CmlxTests.xctest
          xcrun xctest ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/MLXTests.xctest

      - name: Build xcodeproj (Xcode, macOS)
        shell: sh
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          cd xcode
          xcodebuild build-for-testing -scheme MLX -destination 'platform=macOS'

      - name: Run Tests xcodeproj (Xcode, macOS)
        working-directory: xcode
        run: ../.github/scripts/run-xcode-tests.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            ~/Library/Logs/DiagnosticReports/*
          retention-days: 7

      - name: Build (cmake)
        shell: sh
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake .. -G Ninja
          ninja

  linux_build_cmake_container:
    name: Linux Container CMake Swift Build (${{ matrix.container }} ${{ matrix.arch }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # See https://github.com/swiftlang/swift-docker/tree/main/
          - host: ubuntu-22.04
            arch: x86_64
            container: swift:bookworm
          - host: ubuntu-22.04
            arch: x86_64
            container: swift:fedora39
          - host: ubuntu-22.04-arm
            arch: aarch64
            container: swift:bookworm
          - host: ubuntu-22.04-arm
            arch: aarch64
            container: swift:fedora39

    runs-on: ${{ matrix.host }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Linux Container CMake Swift Build - No Release
        run: |
          bash .github/scripts/setup+build-linux-container-cmake.sh

  linux_build_cmake_cuda:
    name: Linux CUDA CMake Swift Build (cuda-12.9, swift-6.2.3-RELEASE, ubuntu-24.04, x86_64)
    needs: lint
    runs-on: "gpu-t4-4-core"
    env:
      # Note 12/18/2025: the CI machine does not meet CUDA 13's driver requirement.
      # Compatibility matrix:
      # https://docs.nvidia.com/deeplearning/cudnn/backend/latest/reference/support-matrix.html
      TOOLKIT_VERSION: "cuda-12.9"
      SWIFT_VERSION: "swift-6.2.3-RELEASE"
      # pub   rsa4096 2024-09-16 [SC] [expires: 2026-09-16]
      #      52BB7E3DE28A71BE22EC05FFEF80A866B47A981F
      # uid           [ unknown] Swift 6.x Release Signing Key <swift-infrastructure@forums.swift.org>
      SWIFT_SIGNING_KEY: "52BB7E3DE28A71BE22EC05FFEF80A866B47A981F"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Linux CUDA Setup
        run: |
          bash .github/scripts/setup-linux-cuda.sh

      - name: Linux CUDA CMake Swift Build - No Release
        run: |
          bash .github/scripts/build-linux-cuda-cmake.sh

  linux_swiftpm:
    name: Linux SwiftPM (${{ matrix.arch }}, Highway ${{ matrix.highway }})
    # Advisory while it is new: builds the Linux profile of Package.swift (the LM libraries and
    # their dependencies) with Highway on x86-64 and arm64, and in a third leg without it, then
    # runs VMLXLinuxTests and the CPU kernel tests. GitHub-hosted runners only: the self-hosted
    # pools queue for a day. python3 is for scripts/check-metal-only.sh.
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            arch: x86_64
            highway: "on"
          - host: ubuntu-24.04-arm
            arch: aarch64
            highway: "on"
          # Without Highway (VMLX_NO_HIGHWAY=1): MLX's scalar CPU code, as the aarch64 leg ran
          # before it had Highway.
          - host: ubuntu-24.04-arm
            arch: aarch64
            highway: "off"
    runs-on: ${{ matrix.host }}
    env:
      VMLX_NO_HIGHWAY: ${{ matrix.highway == 'off' && '1' || '' }}
    container:
      image: swift:6.4-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install the Linux packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libopenblas-dev liblapack-dev liblapacke-dev gfortran g++ libsqlite3-dev python3

      - name: METAL-ONLY check (advisory)
        if: ${{ !cancelled() && hashFiles('scripts/check-metal-only.sh') != '' }}
        continue-on-error: true
        run: bash scripts/check-metal-only.sh

      - name: Build the Linux profile
        run: swift build

      - name: VMLXLinuxTests
        run: |
          set -o pipefail
          swift test --filter VMLXLinuxTests 2>&1 | tee vmlx-linux-tests.log
          grep -Eq 'Test run with [1-9][0-9]* tests? .*passed' vmlx-linux-tests.log

      - name: CPU kernel tests
        run: |
          set -o pipefail
          bash scripts/run-cpu-kernel-tests.sh 2>&1 | tee cpu-kernel-tests.log

      # Last, and with !cancelled(), so a broken checker never hides the build and test results.
      - name: METAL-ONLY checker test
        if: ${{ !cancelled() && hashFiles('scripts/check-metal-only-test.sh') != '' }}
        run: bash scripts/check-metal-only-test.sh

  linux_cpu_kernels_sde:
    name: Linux CPU kernels under SDE (Sapphire Rapids)
    # Advisory: emulated AVX-512 is slow, so it runs one pool configuration and the tests that
    # dispatch per target. The native x86 leg of linux_swiftpm runs everything.
    continue-on-error: true
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Intel SDE
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          sdeVersion: 10.13.1

      - name: Allow ptrace for SDE
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Kernel tests under SDE
        run: |
          docker run --rm --cap-add=SYS_PTRACE -v "$PWD:/work" -v "$SDE_PATH:/sde:ro" -w /work \
            swift:6.4-bookworm bash -c '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libopenblas-dev liblapack-dev liblapacke-dev gfortran g++ libsqlite3-dev python3
              export PATH=/sde:$PATH
              bash scripts/run-cpu-kernel-tests.sh --sde spr --once --stall 5400 \
                --filter "VMLXCPUKernelTests\\.(TargetsTests|QuantizedMatmulTests|NormTests|RopeTests)|AttentionTests/eachPath"'

  linux_cpu_kernels_tsan:
    name: Linux CPU kernels under ThreadSanitizer (aarch64)
    # Advisory: the CPU pool and the threaded kernels under ThreadSanitizer, on arm64. TSan checks
    # the C++ memory model, not the CPU's, so one architecture suffices. Two races in upstream MLX's
    # eval_impl are suppressed (scripts/tsan-suppressions.txt). One pool configuration, the threaded
    # suites only.
    continue-on-error: true
    # 60 min: ~18 expected (4.4 min on a 12-CPU arm64 Linux VM x ~3.6 on this runner, plus setup),
    # doubled, plus the runner's --stall window (1200 s, passed below), so that a hang ends in
    # STALLED, not a timeout.
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fewer random mmap bits, for ThreadSanitizer
        run: |
          sudo sysctl vm.mmap_rnd_bits
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Kernel tests under ThreadSanitizer
        run: |
          docker run --rm -v "$PWD:/work" -w /work swift:6.4-bookworm bash -c '
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libopenblas-dev liblapack-dev liblapacke-dev gfortran g++ libsqlite3-dev python3
            bash scripts/run-cpu-kernel-tests.sh --sanitize thread --once --stall 1200 \
              --filter "VMLXCPUKernelTests\\.(QuantizedMatmulTests|GatherQuantizedMatmulTests|GemmTests|ReductionTests|IndexingTests)|threadedElementwise|threadedRows|threadedSoftmax"'

      - name: Upload the ThreadSanitizer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-kernel-tests
          path: .build/hwy-all-thread/kernel-tests-*.log
          include-hidden-files: true
          overwrite: true
          retention-days: 7
